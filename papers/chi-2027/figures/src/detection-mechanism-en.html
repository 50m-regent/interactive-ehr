<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>A single patient mismatch</title></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 385" role="img" aria-labelledby="title description">
  <title id="title">A single patient mismatch</title>
  <desc id="description">A single patient mismatch</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="1200" height="385" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="30" y="35" font-size="25" fill="#344054">Same illustrative candidate under two checking scopes</text>
    <rect x="30" y="65" width="270" height="125" rx="12" fill="#fff" stroke="#98a2b3" stroke-width="2"/>
    <text x="165.0" y="120.0" text-anchor="middle" font-size="24" fill="#172033">Known target</text>
    <text x="165.0" y="151.0" text-anchor="middle" font-size="24" fill="#172033">Patient A, 24 h</text>
    <rect x="390" y="65" width="230" height="125" rx="12" fill="#fff" stroke="#4d78b8" stroke-width="2"/>
    <text x="505.0" y="120.0" text-anchor="middle" font-size="24" fill="#172033">SQL</text>
    <text x="505.0" y="151.0" text-anchor="middle" font-size="24" fill="#172033">Patient B, 24 h</text>
    <path d="M620 127 H685" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="685" y="65" width="230" height="125" rx="12" fill="#fff" stroke="#4d78b8" stroke-width="2"/>
    <text x="800.0" y="120.0" text-anchor="middle" font-size="24" fill="#172033">Result</text>
    <text x="800.0" y="151.0" text-anchor="middle" font-size="24" fill="#172033">SQL v2</text>
    <path d="M915 127 H970" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="970" y="65" width="200" height="125" rx="12" fill="#fff" stroke="#4d78b8" stroke-width="2"/>
    <text x="1070.0" y="120.0" text-anchor="middle" font-size="24" fill="#172033">View</text>
    <text x="1070.0" y="151.0" text-anchor="middle" font-size="24" fill="#172033">Result v2</text>
    <path d="M300 127 H390" fill="none" stroke="#c1534d" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 5"/>
    <rect x="30" y="235" width="550" height="125" rx="12" fill="#fff" stroke="#5f8c54" stroke-width="2"/>
    <text x="305.0" y="274.5" text-anchor="middle" font-size="24" fill="#172033">Local checks: pass</text>
    <text x="305.0" y="305.5" text-anchor="middle" font-size="24" fill="#172033">SQL form + artifact compatibility</text>
    <text x="305.0" y="336.5" text-anchor="middle" font-size="24" fill="#172033">No comparison with target patient</text>
    <rect x="620" y="235" width="550" height="125" rx="12" fill="#fff" stroke="#c1534d" stroke-width="2"/>
    <text x="895.0" y="274.5" text-anchor="middle" font-size="24" fill="#172033">Full reference checks: reject</text>
    <text x="895.0" y="305.5" text-anchor="middle" font-size="24" fill="#172033">Patient B differs from target A</text>
    <text x="895.0" y="336.5" text-anchor="middle" font-size="24" fill="#172033">Report patient fault; location not scored</text>
  </g>
</svg>

</body></html>
