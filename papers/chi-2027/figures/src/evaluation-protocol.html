<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>参照情報を使う評価手順</title></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title description">
  <title id="title">参照情報を使う評価手順</title>
  <desc id="description">参照情報を使う評価手順</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="1200" height="550" fill="#fff"/>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif">
    <rect x="30" y="20" width="1140" height="85" rx="12" fill="#fff" stroke="#4d78b8" stroke-width="2"/>
    <text x="600.0" y="70.5" text-anchor="middle" font-size="24" fill="#172033">既知の目標　注釈・正解SQL・実行結果・接続先</text>
    <path d="M180 105 V160" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 5"/>
    <path d="M590 105 V160" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 5"/>
    <path d="M1000 105 V160" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 5"/>
    <rect x="30" y="160" width="300" height="135" rx="12" fill="#fff" stroke="#4d78b8" stroke-width="2"/>
    <text x="180.0" y="220.0" text-anchor="middle" font-size="24" fill="#172033">更新ペアの構築</text>
    <text x="180.0" y="251.0" text-anchor="middle" font-size="24" fill="#172033">妥当候補＋不整合候補</text>
    <path d="M330 227 H405" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="405" y="160" width="370" height="135" rx="12" fill="#fff" stroke="#5f8c54" stroke-width="2"/>
    <text x="590.0" y="204.5" text-anchor="middle" font-size="24" fill="#172033">候補の採用条件</text>
    <text x="590.0" y="235.5" text-anchor="middle" font-size="24" fill="#172033">参照判定とラベルが一致</text>
    <text x="590.0" y="266.5" text-anchor="middle" font-size="24" fill="#172033">不整合候補が局所検査を通過</text>
    <path d="M775 227 H850" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="850" y="160" width="320" height="135" rx="12" fill="#fff" stroke="#d49327" stroke-width="2"/>
    <text x="1010.0" y="204.5" text-anchor="middle" font-size="24" fill="#172033">4条件で検査</text>
    <text x="1010.0" y="235.5" text-anchor="middle" font-size="24" fill="#172033">層間検査は目標情報と</text>
    <text x="1010.0" y="266.5" text-anchor="middle" font-size="24" fill="#172033">主要関数を共有</text>
    <path d="M1010 295 V355" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="850" y="355" width="320" height="105" rx="12" fill="#fff" stroke="#4d78b8" stroke-width="2"/>
    <text x="1010.0" y="400.0" text-anchor="middle" font-size="24" fill="#172033">受理・拒否の記録</text>
    <text x="1010.0" y="431.0" text-anchor="middle" font-size="24" fill="#172033">不整合の種類の報告</text>
    <path d="M850 407 H775" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="405" y="340" width="370" height="135" rx="12" fill="#fff" stroke="#d49327" stroke-width="2"/>
    <text x="590.0" y="384.5" text-anchor="middle" font-size="24" fill="#172033">保存済みの妥当部品で復元</text>
    <text x="590.0" y="415.5" text-anchor="middle" font-size="24" fill="#172033">不整合ラベル・注入した種類・</text>
    <text x="590.0" y="446.5" text-anchor="middle" font-size="24" fill="#172033">妥当候補を入力</text>
    <path d="M405 407 H330" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="30" y="355" width="300" height="105" rx="12" fill="#fff" stroke="#5f8c54" stroke-width="2"/>
    <text x="180.0" y="400.0" text-anchor="middle" font-size="24" fill="#172033">同じ検査条件と</text>
    <text x="180.0" y="431.0" text-anchor="middle" font-size="24" fill="#172033">参照判定で再確認</text>
    <text x="600" y="524" text-anchor="middle" font-size="22" fill="#475467">破線は参照情報の入力。生成モデルの実行とブラウザの検査は含まない。</text>
  </g>
</svg>

</body></html>
