<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>層間不整合を検知できる仕組み</title>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 55 1200 460" role="img" aria-labelledby="title description">
      <title id="title">局所検査と層間検査の違い</title>
      <desc id="description">局所検査では各成果物が単独で動作すれば合格する。層間検査では意味キーと版を隣接層で照合するため、実行できても要求と異なる情報を検知できる。</desc>
      <rect width="1200" height="610" fill="#ffffff"/>
      <rect x="38" y="75" width="1124" height="206" rx="18" fill="#f7f8fa" stroke="#98a2b3" stroke-width="2"/>
      <text x="66" y="110" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="20" font-weight="700" fill="#344054">局所検査</text>
      <g font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" text-anchor="middle">
        <rect x="75" y="139" width="198" height="88" rx="13" fill="#ffffff" stroke="#4f8a62" stroke-width="3"/>
        <text x="174" y="187" font-size="19" font-weight="700" fill="#172033">要求</text>
        <rect x="339" y="139" width="198" height="88" rx="13" fill="#ffffff" stroke="#4f8a62" stroke-width="3"/>
        <text x="438" y="187" font-size="19" font-weight="700" fill="#172033">SQL</text>
        <rect x="603" y="139" width="198" height="88" rx="13" fill="#ffffff" stroke="#4f8a62" stroke-width="3"/>
        <text x="702" y="187" font-size="19" font-weight="700" fill="#172033">結果</text>
        <rect x="867" y="139" width="198" height="88" rx="13" fill="#ffffff" stroke="#4f8a62" stroke-width="3"/>
        <text x="966" y="187" font-size="19" font-weight="700" fill="#172033">表示</text>
      </g>
      <g stroke="#667085" stroke-width="3" fill="#667085">
        <line x1="273" y1="183" x2="327" y2="183"/><polygon points="339,183 324,174 324,192"/>
        <line x1="537" y1="183" x2="591" y2="183"/><polygon points="603,183 588,174 588,192"/>
        <line x1="801" y1="183" x2="855" y2="183"/><polygon points="867,183 852,174 852,192"/>
      </g>
      <line x1="306" y1="132" x2="306" y2="235" stroke="#c1534d" stroke-width="4" stroke-dasharray="9 7"/>

      <rect x="38" y="316" width="1124" height="184" rx="18" fill="#fff8e8" stroke="#d49327" stroke-width="3"/>
      <text x="66" y="352" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="20" font-weight="700" fill="#8b5b0b">層間検査</text>
      <g font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" text-anchor="middle">
        <rect x="75" y="383" width="198" height="88" rx="13" fill="#ffffff" stroke="#d49327" stroke-width="2"/>
        <text x="174" y="417" font-size="19" font-weight="700" fill="#172033">要求</text><text x="174" y="446" font-size="14" fill="#475467">患者A・24時間</text>
        <rect x="339" y="383" width="198" height="88" rx="13" fill="#ffffff" stroke="#c1534d" stroke-width="3"/>
        <text x="438" y="417" font-size="19" font-weight="700" fill="#172033">SQL</text><text x="438" y="446" font-size="14" fill="#a33d37">患者B・指定なし</text>
        <rect x="603" y="383" width="198" height="88" rx="13" fill="#ffffff" stroke="#d49327" stroke-width="2"/>
        <text x="702" y="417" font-size="19" font-weight="700" fill="#172033">結果</text><text x="702" y="446" font-size="14" fill="#475467">SQL v2</text>
        <rect x="867" y="383" width="198" height="88" rx="13" fill="#ffffff" stroke="#d49327" stroke-width="2"/>
        <text x="966" y="417" font-size="19" font-weight="700" fill="#172033">表示</text><text x="966" y="446" font-size="14" fill="#475467">結果 v2</text>
      </g>
      <g stroke="#d49327" stroke-width="3" fill="#d49327">
        <line x1="537" y1="427" x2="591" y2="427"/><polygon points="603,427 588,418 588,436"/>
        <line x1="801" y1="427" x2="855" y2="427"/><polygon points="867,427 852,418 852,436"/>
      </g>
      <line x1="273" y1="427" x2="327" y2="427" stroke="#c1534d" stroke-width="4"/>
      <polygon points="339,427 324,418 324,436" fill="#c1534d"/>
      <circle cx="306" cy="427" r="19" fill="#fff2f0" stroke="#c1534d" stroke-width="3"/>
      <text x="306" y="434" text-anchor="middle" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="22" font-weight="700" fill="#a33d37">!</text>
    </svg>
  </body>
</html>
