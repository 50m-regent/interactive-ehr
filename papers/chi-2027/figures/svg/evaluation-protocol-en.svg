<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title description">
  <title id="title">Reference-dependent evaluation</title>
  <desc id="description">Reference-dependent evaluation</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="1200" height="550" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="30" y="20" width="1140" height="85" rx="12" fill="#fff" stroke="#4d78b8" stroke-width="2"/>
    <text x="600.0" y="70.5" text-anchor="middle" font-size="24" fill="#172033">Known target: annotations, reference SQL, result, binding</text>
    <path d="M180 105 V160" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 5"/>
    <path d="M590 105 V160" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 5"/>
    <path d="M1000 105 V160" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 5"/>
    <rect x="30" y="160" width="300" height="135" rx="12" fill="#fff" stroke="#4d78b8" stroke-width="2"/>
    <text x="180.0" y="220.0" text-anchor="middle" font-size="24" fill="#172033">Construct update pair</text>
    <text x="180.0" y="251.0" text-anchor="middle" font-size="24" fill="#172033">valid + injected fault</text>
    <path d="M330 227 H405" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="405" y="160" width="370" height="135" rx="12" fill="#fff" stroke="#5f8c54" stroke-width="2"/>
    <text x="590.0" y="204.5" text-anchor="middle" font-size="24" fill="#172033">Selection gate</text>
    <text x="590.0" y="235.5" text-anchor="middle" font-size="24" fill="#172033">reference labels agree</text>
    <text x="590.0" y="266.5" text-anchor="middle" font-size="24" fill="#172033">invalid passes local checks</text>
    <path d="M775 227 H850" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="850" y="160" width="320" height="135" rx="12" fill="#fff" stroke="#d49327" stroke-width="2"/>
    <text x="1010.0" y="204.5" text-anchor="middle" font-size="24" fill="#172033">4 conditions</text>
    <text x="1010.0" y="235.5" text-anchor="middle" font-size="24" fill="#172033">full checks share</text>
    <text x="1010.0" y="266.5" text-anchor="middle" font-size="24" fill="#172033">target + core functions</text>
    <path d="M1010 295 V355" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="850" y="355" width="320" height="105" rx="12" fill="#fff" stroke="#4d78b8" stroke-width="2"/>
    <text x="1010.0" y="400.0" text-anchor="middle" font-size="24" fill="#172033">Accept / reject</text>
    <text x="1010.0" y="431.0" text-anchor="middle" font-size="24" fill="#172033">Report fault types</text>
    <path d="M850 407 H775" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="405" y="340" width="370" height="135" rx="12" fill="#fff" stroke="#d49327" stroke-width="2"/>
    <text x="590.0" y="384.5" text-anchor="middle" font-size="24" fill="#172033">Restore a saved component</text>
    <text x="590.0" y="415.5" text-anchor="middle" font-size="24" fill="#172033">given invalid label, type,</text>
    <text x="590.0" y="446.5" text-anchor="middle" font-size="24" fill="#172033">and valid candidate</text>
    <path d="M405 407 H330" fill="none" stroke="#667085" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="30" y="355" width="300" height="105" rx="12" fill="#fff" stroke="#5f8c54" stroke-width="2"/>
    <text x="180.0" y="400.0" text-anchor="middle" font-size="24" fill="#172033">Recheck with</text>
    <text x="180.0" y="431.0" text-anchor="middle" font-size="24" fill="#172033">validator + oracle</text>
    <text x="600" y="524" text-anchor="middle" font-size="22" fill="#475467">Dashed arrows supply reference information; no model generation or browser test.</text>
  </g>
</svg>
