<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1200 340" role="img" aria-labelledby="title description">
      <title id="title">Evaluation protocol from reference cases to testing and repair</title>
      <desc id="description">Reference SQL produces update candidates whose labels are checked by an independent oracle. The same candidates are evaluated under four conditions, localized, repaired once, and rechecked by the oracle.</desc>
      <rect width="1200" height="430" fill="#ffffff"/>
      <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#172033">
        <rect x="38" y="92" width="220" height="92" rx="14" fill="#eef5ff" stroke="#4d78b8" stroke-width="2"/>
        <text x="148" y="143" font-size="18" font-weight="700">Reference SQL</text>
        <rect x="326" y="92" width="220" height="92" rx="14" fill="#eef5ff" stroke="#4d78b8" stroke-width="2"/>
        <text x="436" y="143" font-size="18" font-weight="700">Update pair</text>
        <rect x="614" y="92" width="220" height="92" rx="14" fill="#fff8e8" stroke="#d49327" stroke-width="2"/>
        <text x="724" y="143" font-size="18" font-weight="700">Candidates</text>
        <rect x="902" y="92" width="260" height="92" rx="14" fill="#f2f8ee" stroke="#5f8c54" stroke-width="2"/>
        <text x="1032" y="143" font-size="18" font-weight="700">Independent oracle</text>
      </g>
      <g stroke="#667085" stroke-width="3" fill="#667085">
        <line x1="258" y1="138" x2="310" y2="138"/><polygon points="326,138 308,128 308,148"/>
        <line x1="546" y1="138" x2="598" y2="138"/><polygon points="614,138 596,128 596,148"/>
        <line x1="834" y1="138" x2="886" y2="138"/><polygon points="902,138 884,128 884,148"/>
      </g>
      <path d="M1032 184 V238 H436 V276" fill="none" stroke="#667085" stroke-width="3"/>
      <polygon points="436,292 426,274 446,274" fill="#667085"/>
      <rect x="245" y="292" width="382" height="91" rx="15" fill="#fff8e8" stroke="#d49327" stroke-width="3"/>
      <text x="436" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#8b5b0b">4 conditions</text>
      <rect x="671" y="292" width="382" height="91" rx="15" fill="#eef5ff" stroke="#4d78b8" stroke-width="2"/>
      <text x="862" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#244a7c">Localize + one repair</text>
      <line x1="627" y1="338" x2="655" y2="338" stroke="#667085" stroke-width="3"/>
      <polygon points="671,338 653,328 653,348" fill="#667085"/>
      <path d="M1053 338 H1180 V138 H1178" fill="none" stroke="#667085" stroke-width="3"/>
      <polygon points="1162,138 1180,128 1180,148" fill="#667085"/>
    </svg>
