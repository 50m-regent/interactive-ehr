<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
      <title id="title">診療シナリオから利用者価値までの範囲</title>
      <desc id="description">二つの診療シナリオでは必要な情報と表示が異なる。技術評価は情報要求から表示までを扱い、医学的妥当性と利用者便益は別の評価として残る。</desc>
      <rect width="1200" height="690" fill="#ffffff"/>
      <text x="600" y="42" text-anchor="middle" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="27" font-weight="700" fill="#172033">診療シナリオが変われば、必要な情報と妥当な表示も変わる</text>

      <rect x="40" y="80" width="500" height="205" rx="18" fill="#eef5ff" stroke="#4d78b8" stroke-width="2"/>
      <text x="68" y="118" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="22" font-weight="700" fill="#244a7c">麻酔科術前外来</text>
      <text x="68" y="152" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="18" fill="#172033">一回の術前評価</text>
      <text x="68" y="184" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="18" fill="#172033">患者背景・手術情報・直近検査を集約</text>
      <text x="68" y="216" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="18" fill="#172033">最新値を中心に一覧し、麻酔リスクをまとめる</text>
      <text x="68" y="253" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="15" fill="#556176">時間基準：手術日　　診察時の説明：約10分</text>

      <rect x="660" y="80" width="500" height="205" rx="18" fill="#f2f8ee" stroke="#5f8c54" stroke-width="2"/>
      <text x="688" y="118" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="22" font-weight="700" fill="#3d6d36">甲状腺術後フォロー</text>
      <text x="688" y="152" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="18" fill="#172033">3〜6か月ごとの定期再診</text>
      <text x="688" y="184" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="18" fill="#172033">甲状腺機能・超音波所見・補充量を照合</text>
      <text x="688" y="216" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="18" fill="#172033">12か月の推移と最新値を使い分ける</text>
      <text x="688" y="253" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="15" fill="#556176">時間基準：診察日　　診察枠：5分</text>

      <path d="M290 285 V326 H188" fill="none" stroke="#667085" stroke-width="3"/>
      <path d="M910 285 V326 H1012" fill="none" stroke="#667085" stroke-width="3"/>
      <path d="M188 326 H1012" fill="none" stroke="#667085" stroke-width="3"/>
      <path d="M600 326 V357" fill="none" stroke="#667085" stroke-width="3"/>
      <polygon points="600,367 593,354 607,354" fill="#667085"/>

      <rect x="50" y="375" width="895" height="165" rx="20" fill="#fff8e8" stroke="#d49327" stroke-width="3"/>
      <text x="74" y="408" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="16" font-weight="700" fill="#8b5b0b">本稿の技術評価範囲</text>
      <g font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="17" fill="#172033">
        <rect x="78" y="435" width="174" height="70" rx="12" fill="#ffffff" stroke="#d49327" stroke-width="2"/>
        <text x="165" y="466" text-anchor="middle" font-weight="700">情報要求</text>
        <text x="165" y="490" text-anchor="middle" font-size="14">患者・項目・期間</text>
        <rect x="302" y="435" width="174" height="70" rx="12" fill="#ffffff" stroke="#d49327" stroke-width="2"/>
        <text x="389" y="466" text-anchor="middle" font-weight="700">SQL</text>
        <text x="389" y="490" text-anchor="middle" font-size="14">抽出・集約</text>
        <rect x="526" y="435" width="174" height="70" rx="12" fill="#ffffff" stroke="#d49327" stroke-width="2"/>
        <text x="613" y="466" text-anchor="middle" font-weight="700">実行結果</text>
        <text x="613" y="490" text-anchor="middle" font-size="14">版・形状</text>
        <rect x="750" y="435" width="174" height="70" rx="12" fill="#ffffff" stroke="#d49327" stroke-width="2"/>
        <text x="837" y="466" text-anchor="middle" font-weight="700">表示</text>
        <text x="837" y="490" text-anchor="middle" font-size="14">参照・表現</text>
      </g>
      <g fill="#d49327">
        <polygon points="286,470 269,460 269,480"/><polygon points="510,470 493,460 493,480"/><polygon points="734,470 717,460 717,480"/>
      </g>
      <rect x="963" y="435" width="160" height="70" rx="12" fill="#fff2f0" stroke="#c1534d" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="1043" y="461" text-anchor="middle" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="16" font-weight="700" fill="#8b302b">医療者の確認</text>
      <text x="1043" y="486" text-anchor="middle" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="14" fill="#8b302b">判断・行動</text>
      <polygon points="947,470 930,460 930,480" fill="#c1534d"/>

      <rect x="50" y="574" width="1100" height="82" rx="16" fill="#f7f8fa" stroke="#98a2b3" stroke-width="2" stroke-dasharray="9 6"/>
      <text x="600" y="606" text-anchor="middle" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="17" font-weight="700" fill="#344054">別の評価で確かめる範囲</text>
      <text x="600" y="634" text-anchor="middle" font-family="Noto Sans CJK JP, Hiragino Sans, sans-serif" font-size="16" fill="#475467">シナリオと必要情報の医学的妥当性 ／ 確認負担 ／ 誤りの見落とし ／ 診療判断への影響</text>
    </svg>
