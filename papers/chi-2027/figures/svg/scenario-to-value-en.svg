<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
      <title id="title">Scope from clinical scenarios to user value</title>
      <desc id="description">Two clinical scenarios require different information and presentations. The technical evaluation covers the path from information need to presentation, while clinical validity and user benefit remain for separate evaluation.</desc>
      <rect width="1200" height="690" fill="#ffffff"/>
      <text x="600" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#172033">The scenario determines what information and presentation are appropriate</text>

      <rect x="40" y="80" width="500" height="205" rx="18" fill="#eef5ff" stroke="#4d78b8" stroke-width="2"/>
      <text x="68" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#244a7c">Preoperative anesthesia clinic</text>
      <text x="68" y="152" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033">One preoperative assessment</text>
      <text x="68" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033">Patient history, surgery, and recent tests</text>
      <text x="68" y="216" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033">Latest values summarized for anesthesia risks</text>
      <text x="68" y="253" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#556176">Temporal anchor: surgery date   Consultation: about 10 minutes</text>

      <rect x="660" y="80" width="500" height="205" rx="18" fill="#f2f8ee" stroke="#5f8c54" stroke-width="2"/>
      <text x="688" y="118" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#3d6d36">Post-thyroidectomy follow-up</text>
      <text x="688" y="152" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033">Follow-up every three to six months</text>
      <text x="688" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033">Thyroid function, ultrasound, replacement dose</text>
      <text x="688" y="216" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#172033">Twelve-month trends combined with latest values</text>
      <text x="688" y="253" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#556176">Temporal anchor: visit date   Consultation: 5 minutes</text>

      <path d="M290 285 V326 H188" fill="none" stroke="#667085" stroke-width="3"/>
      <path d="M910 285 V326 H1012" fill="none" stroke="#667085" stroke-width="3"/>
      <path d="M188 326 H1012" fill="none" stroke="#667085" stroke-width="3"/>
      <path d="M600 326 V357" fill="none" stroke="#667085" stroke-width="3"/>
      <polygon points="600,367 593,354 607,354" fill="#667085"/>

      <rect x="50" y="375" width="895" height="165" rx="20" fill="#fff8e8" stroke="#d49327" stroke-width="3"/>
      <text x="74" y="408" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b5b0b">Technical scope of this paper</text>
      <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#172033">
        <rect x="78" y="435" width="174" height="70" rx="12" fill="#ffffff" stroke="#d49327" stroke-width="2"/>
        <text x="165" y="466" text-anchor="middle" font-weight="700">Information need</text>
        <text x="165" y="490" text-anchor="middle" font-size="14">patient, item, time</text>
        <rect x="302" y="435" width="174" height="70" rx="12" fill="#ffffff" stroke="#d49327" stroke-width="2"/>
        <text x="389" y="466" text-anchor="middle" font-weight="700">SQL</text>
        <text x="389" y="490" text-anchor="middle" font-size="14">retrieval, aggregation</text>
        <rect x="526" y="435" width="174" height="70" rx="12" fill="#ffffff" stroke="#d49327" stroke-width="2"/>
        <text x="613" y="466" text-anchor="middle" font-weight="700">Result</text>
        <text x="613" y="490" text-anchor="middle" font-size="14">version, shape</text>
        <rect x="750" y="435" width="174" height="70" rx="12" fill="#ffffff" stroke="#d49327" stroke-width="2"/>
        <text x="837" y="466" text-anchor="middle" font-weight="700">Presentation</text>
        <text x="837" y="490" text-anchor="middle" font-size="14">reference, form</text>
      </g>
      <g fill="#d49327">
        <polygon points="286,470 269,460 269,480"/><polygon points="510,470 493,460 493,480"/><polygon points="734,470 717,460 717,480"/>
      </g>
      <rect x="963" y="435" width="160" height="70" rx="12" fill="#fff2f0" stroke="#c1534d" stroke-width="2" stroke-dasharray="8 6"/>
      <text x="1043" y="461" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8b302b">Clinician review</text>
      <text x="1043" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8b302b">judgment, action</text>
      <polygon points="947,470 930,460 930,480" fill="#c1534d"/>

      <rect x="50" y="574" width="1100" height="82" rx="16" fill="#f7f8fa" stroke="#98a2b3" stroke-width="2" stroke-dasharray="9 6"/>
      <text x="600" y="606" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#344054">Questions for separate evaluation</text>
      <text x="600" y="634" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#475467">Clinical validity / verification burden / missed errors / effects on clinical judgment</text>
    </svg>
